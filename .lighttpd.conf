# lighttpd configuration for WikiMillionaire
# URL rewriting to support friendly URLs without .php extension

# Enable mod_rewrite
server.modules += ( "mod_rewrite" )

# URL rewriting rules
url.rewrite-if-not-file = (
    # Rewrite requests without .php extension to add .php
    # Only if the .php file exists and the request is not for an existing file
    "^/([^.?]+)$" => "/$1.php",
    "^/([^.?]+)\?(.*)$" => "/$1.php?$2"
)

# Set default document
index-file.names = ( "index.php", "index.html" )

